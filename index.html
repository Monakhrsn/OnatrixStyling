<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/output.css" rel="stylesheet" />
    <title>Onatrix</title>
  </head>
  <body>

    <!-- Main page -->
    <section class="relative py-[7rem] overflow-hidden">

      <!-- Hero -->
      <div class="absolute inset-0">
        <img src="./images/Hero.svg" alt="Business" class="w-full h-full object-cover">
      </div>

      <div class="relative z-10 mx-auto max-w-7xl px-6 lg:px-12">
        <!-- Content -->
        <div class="flex flex-col lg:flex-row items-center">
          <div class="w-full lg:w-1/2 space-y-8">
            <h1 class="text-[#4F5955] font-bold text-[4.375rem] leading-[1.1] tracking-tight">We bring success to you</h1>
            <p class="text-[#4F5955] text-lg leading-relaxed max-w-[85%]">Lorem ipsum dolor sit amet, consectetur. adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim</p>
            <a class="inline-block bg-[#4F5955] text-white px-10 py-3 rounded font-semibold hover:bg-[#3e4743] transition-all duration-300">Contact us</a>
          </div>
          <div class="w-1/2 p-4"></div>
        </div>
    </section>
        <!-- Form -->
    <section>
        <div class="relative bg-white shadow-xl overflow-hidden w-full 
                    md:w-[560px] md:ml-auto md:mr-16 
                    md:mt-[120px] lg:mt-[270px] 
                    md:translate-x-32 lg:translate-x-12" >
          <div class="bg-[#4F5955] text-white px-8 py-6">
            <h3 class="text-2xl font-extrabold">Request a call back</h3>
          </div>
          <div class="px-8 py-6">
            <form class="grid gap-3">
              <input type="text" placeholder="Name" class="w-full border border-gray-200 p-2 focus:outline-none focus:ring-2 focus:ring-[#4F5955]">
              <input type="text" placeholder="Email address" class="w-full border border-gray-200 p-2 focus:outline-none focus:ring-2 focus:ring-[#4F5955]">
              <input type="text" placeholder="Phone" class="w-full border border-gray-200 p-2 focus:outline-none focus:ring-2 focus:ring-[#4F5955]">
              <select class="w-full border border-gray-200 p-3 bg-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#4F5955]">
                <option>Financial consulting</option>
                <option>Strategy</option>
                <option>Tax & audit</option>
                <option>Risk management</option>
              </select>
              <button class="bg-[#F2EDDC] text-[#535656] font-bold w-full py-2">Submit</button>
            </form>
          </div>
        </div>
    </section>
  </body>
</html>
